<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
</head>

<body>
    <header class="bg-dark | bg-gradient">
        <h1 class="d-flex | flex-row">
            <div id="titleHeader" class="p-4 | bd-highlight | text-primary ">
                ActivePlay
            </div>
            <div class="dropdown | my-auto | px-5 | mx-2 | pb-2 | border-end | border-2 | border-primary | border-gradient">
                <button class="btn btn-primary | dropdown-toggle | bg-transparent | px-4" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Facilities
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">View Facilities</a></li>
                    <li><a name="adminOnly" class="dropdown-item text-danger" href="#">Edit Facilities</a></li>
                </ul>
            </div>
            <div class="dropdown | my-auto | px-5 | mx-2 | pb-2 | border-end | border-2 | border-primary | border-gradient">
                <button class="btn btn-primary | dropdown-toggle | bg-transparent | px-4" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Events
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">View Events</a></li>
                    <li><a class="dropdown-item" href="#">Registered Events</a></li>
                    <li><a  name="adminOnly" class="dropdown-item text-danger" href="#">Edit Events</a></li>
                </ul>
            </div>
            <div class="dropdown | my-auto | px-5 | mx-2 | pb-2">
                <button class="btn btn-primary | dropdown-toggle | bg-transparent | px-4" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Booking
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Book Facilities</a></li>
                    <li><a class="dropdown-item" href="#">Edit Bookings</a></li>
                    <li><a class="dropdown-item" href="#">View Booking History</a></li>
                </ul>
            </div>
            <div class="my-auto | pb-2 | ps-5 | ms-5">
                <button class="text-primary | bg-transparent | border-0 | fs-5 | pe-3 | border-end | border-2 | border-secondary | border-gradient">
                    Register
                </button>
                <button class="text-primary | bg-transparent | border-0 | fs-5">
                    Log In
                </button>
            </div>
        </h1>
    </header>

    
</body>

</html>
