{% extends 'layout.html' %}
{% block content %}

{%for user in userList%}
<div class="container d-flex justify-content-center align-items-center">
    <div class="card" style="width:70%;">
        <div class="card-header">
            <div class="card-body">
                <div class="container my-5">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-primary text-white">
                                    <h4 class="mb-0">Reset Password</h4>
                                </div>
                                <div class="card-body">
                                    <form href="{{url_for('resetPassword', id = user.get_uid())}}">
                                        <div class="form-group pb-3">
                                            Enter new Password
                                            {{resetPasswordForm.userPassword(class='form-control')}}
                                        </div>
                                        <div class="form-group pb-3">
                                            Confirm new Password
                                            {{resetPasswordForm.userConfirmPassword(class='form-control')}}
                                        </div>
                                        <button type="submit" class="btn btn-primary btn-block" name="submitReset">Reset Password</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{%endfor%}
{% endblock %}
